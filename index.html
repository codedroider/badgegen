<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра-генератор SVG Base64</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { max-width: 550px; width: 100%; text-align: center; background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; box-sizing: border-box; }
    input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; width: 100%; margin-bottom: 15px; }
    button { padding: 14px; width: 100%; font-size: 16px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2ea44f; }
    textarea { padding: 12px; width: 100%; height: 110px; font-family: monospace; background: #0d1117; color: #58a6ff; border: 1px solid #30363d; border-radius: 6px; box-sizing: border-box; resize: none; margin-top: 15px; }
    .preview { margin: 20px 0; border: 1px dashed #30363d; padding: 10px; background: #000; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Бессерверный Base64 SVG Генератор</h2>
    <input type="text" id="textInput" value="Мой статичный статус">
    
    <div class="preview" id="svgPreview"></div>
    
    <button onclick="copyCode()">📋 Скопировать Markdown код</button>
    <textarea id="outputCode" readonly></textarea>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const preview = document.getElementById('svgPreview');
    const output = document.getElementById('outputCode');

    function generateCode() {
      const text = textInput.value || "Текст";

      const rawSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 60" width="100%" height="100%"><style>.bg{fill:#121212;rx:8px}.txt{font-family:system-ui,sans-serif;font-size:22px;font-weight:bold;fill:#E0E0E0}</style><rect width="100%" height="100%" class="bg"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="txt">${text}</text></svg>`;

      const base64 = btoa(unescape(encodeURIComponent(rawSvg)));
      
      const dataUrl = `data:image/svg+xml;base64,${base64}`;

      preview.innerHTML = `<img src="${dataUrl}" style="max-width:100%">`;
      output.value = `![Статус](${dataUrl})`;
    }

    function copyCode() {
      output.select();
      document.execCommand('copy');
      alert('Код скопирован! Теперь просто вставь его в свой README.md');
    }

    textInput.addEventListener('input', generateCode);
    generateCode(); 
  </script>
</body>
</html>
