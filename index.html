<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>badgegen</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #161b22;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #30363d;
      box-sizing: border-box;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .field {
      flex: 1;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #8b949e;
    }
    input, select {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
      width: 100%;
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-field input {
      width: auto;
      margin: 0;
    }
    button {
      padding: 14px;
      width: 100%;
      font-size: 16px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #2ea44f; }
    .preview {
      margin: 25px 0;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>badgegen</h2>
    
    <label class="checkbox-field">
      <input type="checkbox" id="useLeft" checked>
      <span>left text enabled</span></span>
    </label>

    <div class="row">
      <div class="field" id="leftFieldBox">
        <label>left text</label>
        <input type="text" id="leftText" value="your">
      </div>
      <div class="field">
        <label>right text</label>
        <input type="text" id="rightText" value="text">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>color for right text</label>
        <select id="rightColor">
          <option value="#238636">green</option>
          <option value="#1f6feb">blue</option>
          <option value="#da3633">red</option>
          <option value="#8957e5">violet</option>
          <option value="#f0883e">orange</option>
          <option value="#121212">black</option>
        </select>
      </div>
    </div>
    
    <div class="preview" id="badgePreview"></div>
    
    <button onclick="downloadPNG()">download badge (.png)</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const useLeft = document.getElementById('useLeft');
    const leftText = document.getElementById('leftText');
    const rightText = document.getElementById('rightText');
    const rightColor = document.getElementById('rightColor');
    const preview = document.getElementById('badgePreview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const leftFieldBox = document.getElementById('leftFieldBox');

    function drawBadge() {
      const showLeft = useLeft.checked;
      const leftVal = leftText.value || "";
      const rightVal = rightText.value || "";
      const colorVal = rightColor.value;

      leftFieldBox.style.opacity = showLeft ? "1" : "0.4";
      leftText.disabled = !showLeft;

      ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      
      const padding = 16;
      const rightWidth = Math.ceil(ctx.measureText(rightVal).width) + padding;
      const leftWidth = showLeft ? (Math.ceil(ctx.measureText(leftVal).width) + padding) : 0;
      const totalWidth = leftWidth + rightWidth;

      canvas.width = totalWidth;
      canvas.height = 20;

      ctx.beginPath();
      ctx.roundRect(0, 0, totalWidth, 20, 4);
      ctx.clip();

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (showLeft) {
        ctx.fillStyle = "#555555";
        ctx.fillRect(0, 0, leftWidth, 20);
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.fillText(leftVal, leftWidth / 2, 11);
      }

      ctx.fillStyle = colorVal;
      ctx.fillRect(leftWidth, 0, rightWidth, 20);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(rightVal, leftWidth + (rightWidth / 2), 11);

      preview.innerHTML = `<img src="${canvas.toDataURL('image/png')}" alt="preview">`;
    }

    function downloadPNG() {
      const element = document.createElement("a");
      element.download = "badge.png";
      element.href = canvas.toDataURL('image/png');
      element.click();
    }

    useLeft.addEventListener('change', drawBadge);
    leftText.addEventListener('input', drawBadge);
    rightText.addEventListener('input', drawBadge);
    rightColor.addEventListener('change', drawBadge);

    drawBadge();
  </script><br>
  <center><iframe 
    src="https://codebanners.neocities.org/1banner" 
    width="468" 
    height="80" 
    style="border: none; overflow: hidden;" 
    scrolling="no">
    error loading ad!
  </iframe>
  
  <iframe 
    src="https://codedroider.github.io/support-me/buttons_en?badgegen" 
    style="width: 360px; height: 160px; border: none; overflow: hidden; background: transparent;" 
    scrolling="no" 
    frameborder="0" 
    allowtransparency="true">
    error loading support-me!
  </iframe></center>
  
</body>
</html>
